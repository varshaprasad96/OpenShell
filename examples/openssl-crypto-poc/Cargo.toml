[package]
name = "openshell-openssl-poc"
version = "0.0.0"
edition = "2024"
publish = false

# Isolate feature resolution from the application's AWS-LC selection.
[workspace]

[dependencies]
openshell-crypto = { path = "../../crates/openshell-crypto", default-features = false }
openssl = { version = "0.10.79", default-features = false }
rustls-openssl = { version = "=0.4.1", default-features = false, features = ["tls12"] }
jsonwebtoken-openssl = "=1.0.0"
jsonwebtoken = { version = "10.3", default-features = false, features = ["use_pem"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["pem"] }

[dev-dependencies]
serde_json = "1"
